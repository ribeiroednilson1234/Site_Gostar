CI/CD: on

apiVersion: v1
clusters:
- cluster:
    certificate-authority: ca-certificates
    server: https://127.0.0.1:3306
  name: ovni@ovni-Inspiron-1545
- cluster:
    insecure-skip-tls-verify: true
    server: https://127.0.0.1:3306
  name: Site_Gostar
contexts:
- context:
    cluster: development
    namespace: frontend
    user: developer
  name: dev-frontend
- context:
    cluster: development
    namespace: storage
    user: developer
  name: dev-storage
- context:
    cluster: test
    namespace: default
    user: experimenter
  name: exp-test
current-context: ""
kind: Config
preferences: {../home/ovni/htdocs/Site_Gostar}
users:
- name: developer
  user:
    client-certificate: fake-cert-file
    client-key: fake-key-file
- name: experimenter
  user:
    # Nota de documentação (este comentário NÃO faz parte da saída do comando).
    # Armazenar senhas na configuração do cliente Kubernetes é arriscado.
    # Uma alternativa melhor seria usar um plugin de credenciais
    # e armazenar as credenciais separadamente.
    # Veja https://kubernetes.io/pt-br/docs/reference/access-authn-authz/authentication/#plugins-de-credenciais-client-go
    password: linux@1234
    username: ovni
    
cd:
rest:
ovni@ovni-Inspiron-1545: kubectl config view
